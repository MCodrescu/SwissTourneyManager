{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Swiss Tourney Manager{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'tournaments/site.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{% url 'tournaments:tournament_list' %}">Swiss Tourney Manager</a>
        {% if tournament %}
            <button class="nav-toggle" type="button" aria-controls="tournament-navigation" aria-expanded="false">
                <span class="nav-toggle-icon" aria-hidden="true">&#9776;</span>
                <span class="nav-toggle-label">Menu</span>
            </button>
            <nav id="tournament-navigation">
                <a href="{% url 'tournaments:tournament_list' %}">Tournaments</a>
                <a href="{% url 'tournaments:tournament_detail' tournament.id %}">Overview</a>
                <a href="{% url 'tournaments:player_list' tournament.id %}">Players</a>
                <a href="{% url 'tournaments:standings' tournament.id %}">Standings</a>
            </nav>
        {% endif %}
    </header>
    <main class="page">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message {{ message.tags }}" role="alert">
                        <span>{{ message }}</span>
                        <button class="message-dismiss" type="button" aria-label="Dismiss notification">&times;</button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <script>
        document.addEventListener('click', function (event) {
            if (event.target.classList.contains('message-dismiss')) {
                event.target.closest('.message').remove();
            }
        });
        document.querySelectorAll('.message').forEach(function (message) {
            window.setTimeout(function () {
                message.remove();
            }, 3000);
        });

        document.querySelectorAll('.nav-toggle').forEach(function (toggle) {
            toggle.addEventListener('click', function () {
                var navigation = document.getElementById(toggle.getAttribute('aria-controls'));
                var isExpanded = toggle.getAttribute('aria-expanded') === 'true';

                toggle.setAttribute('aria-expanded', String(!isExpanded));
                navigation.classList.toggle('is-open', !isExpanded);
            });
        });
    </script>
</body>
</html>
