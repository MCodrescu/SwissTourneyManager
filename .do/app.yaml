name: swiss-tourney-manager
services:
  - name: web
    github:
      repo: your-github-user/swiss-tourney-manager
      branch: main
      deploy_on_push: true
    environment_slug: python
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    build_command: pip install -r requirements.txt && python manage.py collectstatic --noinput
    run_command: gunicorn chess_tournament.wsgi --bind 0.0.0.0:8080
envs:
  - key: DEBUG
    value: "False"
    scope: RUN_AND_BUILD_TIME
  - key: SECRET_KEY
    value: replace-with-a-secure-secret-key
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: ALLOWED_HOSTS
    value: .ondigitalocean.app,localhost,127.0.0.1
    scope: RUN_AND_BUILD_TIME
